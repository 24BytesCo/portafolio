<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1600 450" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Arquitectura de SECOP Monitor</title>
  <desc id="d">Los datos abiertos de SECOP I y II entran cada hora a PostgreSQL. El matcher cruza cada proceso con las alertas y el resumen diario sale por correo y WhatsApp. De la misma base salen el seguimiento de cambios y las fichas públicas.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f6b5c"/></marker>
  </defs>
  <rect y="50" width="1600" height="450" fill="#ffffff"/>
  <g fill="#ffffff" stroke="#18181b" stroke-width="2">
    <rect x="30" y="90" width="250" height="110" rx="14"/>
    <rect x="350" y="90" width="180" height="110" rx="14"/>
    <rect x="600" y="90" width="340" height="110" rx="14" fill="#ecf5f3" stroke="#0f6b5c"/>
    <rect x="1010" y="90" width="260" height="110" rx="14"/>
    <rect x="1340" y="90" width="240" height="110" rx="14"/>
    <rect x="440" y="350" width="310" height="110" rx="14"/>
    <rect x="790" y="350" width="310" height="110" rx="14"/>
    <rect x="1340" y="350" width="108" height="72" rx="12"/>
    <rect x="1462" y="350" width="118" height="72" rx="12"/>
  </g>
  <g fill="none" stroke="#0f6b5c" stroke-width="2.5" marker-end="url(#f)">
    <path d="M280 145H342"/><path d="M530 145H592"/><path d="M940 145H1002"/><path d="M1270 145H1332"/>
    <path d="M700 200V290H595V342"/><path d="M840 200V290H945V342"/>
    <path d="M1394 200V342"/><path d="M1521 200V342"/>
  </g>
  <g fill="#18181b" text-anchor="middle">
    <g font-size="25" font-weight="700">
      <text x="155" y="138">datos.gov.co</text>
      <text x="440" y="138">Ingesta</text>
      <text x="770" y="138">PostgreSQL</text>
      <text x="1140" y="138">Matcher</text>
      <text x="1460" y="138">Resumen diario</text>
      <text x="595" y="398">Seguimiento</text>
      <text x="945" y="398">Fichas públicas</text>
    </g>
    <g font-size="18" fill="#52525b">
      <text x="155" y="171">SECOP I y SECOP II</text>
      <text x="440" y="171">cada hora</text>
      <text x="770" y="171">procesos + vector de búsqueda</text>
      <text x="1140" y="171">texto completo + reglas</text>
      <text x="1460" y="171">ordenado por relevancia</text>
      <text x="595" y="431">cambios en pliegos y fechas</text>
      <text x="945" y="431">HTML desde el servidor</text>
    </g>
    <g font-size="18" font-weight="600">
      <text x="1394" y="392">Correo</text>
      <text x="1521" y="392">WhatsApp</text>
    </g>
  </g>
  <text x="311" y="130" font-size="16" fill="#0f6b5c" text-anchor="middle">API</text>
</svg>
